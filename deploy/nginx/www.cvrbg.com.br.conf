# ---------------------------------------------------------------------------
# Site institucional (Next.js) — vhost do droplet.
#
# Copia para /etc/nginx/sites-available/www.cvrbg.com.br e cria o symlink em
# sites-enabled. O deploy.sh nao mexe em Nginx de proposito: config de borda se
# muda com nginx -t na frente, nao no meio de um deploy automatico.
#
# TLS: certificado de origem da Cloudflare (snippets/cvrbg-ssl.conf), que cobre
# cvrbg.com.br e *.cvrbg.com.br — os dois nomes servidos aqui.
# ---------------------------------------------------------------------------
upstream cvrbg_site {
    # Container do Next em modo standalone (deploy/docker-compose.yml).
    server 127.0.0.1:3001;
    keepalive 32;
}

# HTTP -> HTTPS, para os dois nomes.
server {
    listen 80;
    listen [::]:80;
    server_name cvrbg.com.br www.cvrbg.com.br;
    return 301 https://www.cvrbg.com.br$request_uri;
}

# Apex -> www. Mantem o comportamento que ja existia na Vercel (apex devolvia
# 308 para www), entao nenhum link indexado muda de destino.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cvrbg.com.br;

    include snippets/cvrbg-ssl.conf;

    return 301 https://www.cvrbg.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cvrbg.com.br;

    include snippets/cvrbg-ssl.conf;

    # Cabecalhos de seguranca. HSTS fica na Cloudflare (Edge Certificates),
    # nao aqui — assim vale pra borda inteira, nao so pro que chega no origin.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Formulario de contato manda JSON pequeno; nada aqui recebe upload.
    client_max_body_size 1m;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash no nome: imutaveis. O proprio Next ja manda o
    # Cache-Control certo, mas fixamos aqui para nao depender disso.
    location /_next/static/ {
        proxy_pass http://cvrbg_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    location / {
        proxy_pass http://cvrbg_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        # $remote_addr ja e o IP real do visitante: o real_ip da Cloudflare
        # esta em conf.d/cloudflare-realip.conf. E dele que /api/contact
        # depende para o rate limit por IP.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    access_log /var/log/nginx/www.cvrbg.access.log;
    error_log  /var/log/nginx/www.cvrbg.error.log;
}
